<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hugo Kirbach — Applis musique</title>
  <meta name="description" content="Premier Mix et BeatForge, deux applis musique jouables même hors ligne.">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes applis">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .apps {
      display: grid;
      gap: 1rem;
      width: 100%;
      max-width: 720px;
    }
    .app {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 1rem;
      align-items: center;
      padding: 0.75rem;
      border-radius: 18px;
      background: #1e293b;
      color: inherit;
      text-decoration: none;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .app:hover, .app:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .app img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 390 / 600;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      background: #334155;
    }
    .app h2 { margin: 0 0 0.25rem; font-size: 1.2rem; }
    .app p { margin: 0 0 0.75rem; font-size: 0.9rem; color: #cbd5e1; line-height: 1.35; }
    .open {
      display: inline-block;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .offline { display: block; margin-top: 0.6rem; font-size: 0.8rem; color: #94a3b8; }
    .offline.ready { color: #4ade80; }
    .tycoon { --accent: #f97316; }
    .learning { --accent: #8b5cf6; }
    .install { text-align: center; font-size: 0.9rem; color: #cbd5e1; max-width: 420px; }
    .install button {
      font: inherit;
      font-weight: 700;
      padding: 0.7rem 1.2rem;
      border: 0;
      border-radius: 10px;
      background: #f1f5f9;
      color: #0f172a;
      cursor: pointer;
    }
    [hidden] { display: none !important; }
    @media (min-width: 640px) {
      .apps { grid-template-columns: 1fr 1fr; }
      .app { grid-template-columns: 1fr; text-align: center; padding: 1rem; }
      .app img { max-height: 360px; }
    }
  </style>
</head>
<body>
  <main class="apps">
    <a class="app tycoon" href="/music-studio-tycoon/">
      <img src="/previews/tycoon.jpg" alt="Aperçu de Premier Mix : un studio en 3D installé dans une chambre" width="390" height="600">
      <div>
        <h2>🎛️ Premier Mix</h2>
        <p>Monte ton studio de musique, de ta chambre au complexe légendaire.</p>
        <span class="open">Jouer</span>
        <span class="offline" data-scope="/music-studio-tycoon/">Préparation hors ligne…</span>
      </div>
    </a>
    <a class="app learning" href="/music-learning-tool/">
      <img src="/previews/learning.jpg" alt="Aperçu de BeatForge : l'écran d'accueil avec la session express" width="390" height="600">
      <div>
        <h2>🎹 BeatForge</h2>
        <p>Sessions courtes et ludiques pour apprendre à composer.</p>
        <span class="open">S'entraîner</span>
        <span class="offline" data-scope="/music-learning-tool/">Préparation hors ligne…</span>
      </div>
    </a>
  </main>

  <div class="install" id="install" hidden>
    <button type="button" id="install-btn" hidden>📲 Installer sur ce téléphone</button>
    <p id="install-ios" hidden>Pour l'installer : touche <strong>Partager</strong> puis <strong>Sur l'écran d'accueil</strong>.</p>
  </div>

  <script>
    // Hors ligne : le menu a son service worker, et on enregistre aussi celui de chaque appli
    // pour qu'elles téléchargent leurs fichiers dès maintenant, sans attendre qu'on les ouvre.
    const APPS = ['/music-studio-tycoon/', '/music-learning-tool/'];

    function showReady(scope) {
      const el = document.querySelector(`.offline[data-scope="${scope}"]`);
      el.textContent = '✓ Disponible hors ligne';
      el.classList.add('ready');
    }

    function watch(reg, scope) {
      if (reg.active) return showReady(scope);
      const sw = reg.installing || reg.waiting;
      if (!sw) return;
      sw.addEventListener('statechange', () => { if (sw.state === 'activated') showReady(scope); });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
      for (const scope of APPS) {
        navigator.serviceWorker.register(scope + 'sw.js', { scope })
          .then((reg) => watch(reg, scope))
          .catch(() => {
            // Hors ligne avec une appli déjà prête : l'enregistrement échoue mais le cache est là.
            navigator.serviceWorker.getRegistration(scope).then((reg) => reg && watch(reg, scope));
          });
      }
    } else {
      document.querySelectorAll('.offline').forEach((el) => { el.hidden = true; });
    }

    // Installation sur l'écran d'accueil.
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const box = document.getElementById('install');
    const btn = document.getElementById('install-btn');
    let deferred = null;

    if (!standalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferred = e;
        box.hidden = false;
        btn.hidden = false;
      });
      btn.addEventListener('click', async () => {
        if (!deferred) return;
        deferred.prompt();
        await deferred.userChoice;
        deferred = null;
        box.hidden = true;
      });
      window.addEventListener('appinstalled', () => { box.hidden = true; });
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) {
        box.hidden = false;
        document.getElementById('install-ios').hidden = false;
      }
    }
  </script>
</body>
</html>
